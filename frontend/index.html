<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="A fast, accessible todo list app with offline support and reliable synchronization.">
    <meta name="application-name" content="Things to do">
    <meta name="theme-color" content="#000000">
    <!-- Lets the browser paint a sensible canvas for the few frames before
         CssBaseline takes over, without hard-coding a colour the theme owns. -->
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon-todo.png" type="image/png">
    <title>Things to do | Sellpy Sandbox</title>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
